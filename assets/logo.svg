  <rect x="9" y="9" width="78" height="78" rx="20" fill="#07101c" fill-opacity=".72" stroke="#176bc0" stroke-opacity=".45" stroke-width="1.5"/>
  <rect x="9" y="9" width="78" height="78" rx="20" fill="none" stroke="url(#rim)" stroke-width="1.8" filter="url(#blueGlow)"/>
  <path d="M14 22V28M14 22H20M82 68V74M76 74H82" fill="none" stroke="#84d9ff" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
