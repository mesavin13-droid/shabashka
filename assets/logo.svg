  <path d="M20 24H34M51 24H55M72 24H76" stroke="#fff" stroke-opacity=".8" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M21 68Q21 74 29 74H67Q75 74 75 68" fill="none" stroke="#63bdff" stroke-width="1.1" opacity=".95" filter="url(#blueGlow)"/>
