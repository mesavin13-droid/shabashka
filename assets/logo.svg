      <feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="letter-sh" fill-rule="evenodd" d="M18 22H36V57Q36 63 42 63H43Q49 63 49 57V22H57V57Q57 63 63 63H64Q70 63 70 57V22H78V66Q78 76 68 76H28Q18 76 18 66Z"/>
