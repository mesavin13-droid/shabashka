<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Логотип ШАБАШКА — буква Ш">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17263b"/>
      <stop offset=".55" stop-color="#0b1422"/>
      <stop offset="1" stop-color="#070d17"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67d7ff"/>
      <stop offset=".45" stop-color="#168fff"/>
      <stop offset="1" stop-color="#1455dc"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".9" y2="1">
